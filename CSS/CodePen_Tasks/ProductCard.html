<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tilted Product Card</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

      * {
        font-family: 'Poppins', sans-serif;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #818589, #131313);
      }

      .container {
        position: relative;
      }

      .container .card {
        position: relative;
        width: 320px;
        height: 450px;
        background: #232323;
        border-radius: 20px;
        overflow: hidden;
        cursor: pointer;
      }

      .container .card:before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #8a2be2, #4169e1);
        clip-path: circle(150px at 80% 20%);
        transition: 0.5s ease-in-out;
      }

      .container .card:hover:before {
        clip-path: circle(300px at 80% -20%);
      }

      .container .card:after {
        content: 'Nike';
        position: absolute;
        top: 30%;
        left: -20%;
        font-size: 12em;
        font-weight: 800;
        font-style: italic;
        color: rgba(255, 255, 25, 0.05);
      }

      .container .card .imgBx {
        position: absolute;
        top: 35%;
        transform: translateY(-50%) rotate(-25deg);
        z-index: 10000;
        width: 100%;
        height: 220px;
        transition: 0.5s;
      }

      .container .card:hover .imgBx {
        top: 0%;
        transform: translateY(0%) rotate(0deg);
      }

      .container .card .imgBx img {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 270px;
        transition: 0.5s;
      }

      .container .card .contentBx {
        position: absolute;
        bottom: 0;
        width: 100%;
        height: 100px;
        text-align: center;
        transition: 1s;
        z-index: 10;
        overflow: hidden;
      }

      .container .card:hover .contentBx {
        height: 210px;
      }

      .container .card .contentBx h2 {
        position: relative;
        font-weight: 600;
        letter-spacing: 1px;
        color: #fff;
        margin: 0;
      }

      .container .card .contentBx .size,
      .container .card .contentBx .color {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 0;
        opacity: 0;
        visibility: hidden;
        transition: 0.5s;
      }

      .container .card:hover .contentBx .size {
        opacity: 1;
        visibility: visible;
        transition-delay: 0.5s;
      }

      .container .card:hover .contentBx .color {
        opacity: 1;
        visibility: visible;
        transition-delay: 0.6s;
      }

      .container .card .contentBx .size h3,
      .container .card .contentBx .color h3 {
        color: #fff;
        font-weight: 300;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-right: 10px;
      }

      .container .card .contentBx .size span {
        width: 26px;
        height: 26px;
        line-height: 26px;
        font-size: 14px;
        display: inline-block;
        color: #111;
        background: #fff;
        margin: 0 5px;
        border-radius: 4px;
        cursor: pointer;
        transition: 0.3s;
      }

      .container .card .contentBx .size span:hover {
        background: #9bdc28;
        color: #fff;
      }

      .container .card .c
      ontentBx .color span {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        margin: 0 5px;
        cursor: pointer;
        display: inline-block;
      }

      .container .card .contentBx .color span:nth-child(1) {
        background: #ff0;
      }
      .container .card .contentBx .color span:nth-child(2) {
        background: #9bdc28;
      }
      .container .card .contentBx .color span:nth-child(3) {
        background: #03a9f4;
      }
      .container .card .contentBx .color span:nth-child(4) {
        background: #e91e63;
      }

      /* Buy button */
      .container .card .contentBx a {
        display: inline-block;
        padding: 10px 20px;
        background: #fff;
        border-radius: 4px;
        margin-top: 10px;
        text-decoration: none;
        font-weight: 600;
        color: #111;
        opacity: 0;
        transform: translateY(50px);
        transition: 0.5s, transform 0.3s ease, background 0.3s ease,
          color 0.3s ease;
      }

      .container .card:hover .contentBx a {
        opacity: 1;
        transform: translateY(0px);
        transition-delay: 0.75s;
      }

      .container .card .contentBx a:hover {
        background: #9bdc28;
        color: #fff;
        transform: scale(1.1);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div class="imgBx">
          <img src="images/Purple_shoe.png" alt="Nike Shoe" />
        </div>

        <div class="contentBx">
          <h2>Nike Shoes</h2>

          <div class="size">
            <h3>Size:</h3>
            <span>7</span>
            <span>8</span>
            <span>9</span>
            <span>10</span>
          </div>

          <div class="color">
            <h3>Color:</h3>
            <span class="purple"></span>
            <span class="green"></span>
            <span class="blue"></span>
            <span class="pink"></span>
          </div>

          <a href="#">Buy Now</a>
        </div>
      </div>
    </div>
  </body>
</html>
