<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .grid-container {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-auto-rows: 100px;
        gap: 10px;
      }

      .box {
        background: #4e89ff;
        color: white;
        padding: 10px;
      }

      .tall {
        height: 200px;
        background: #ff5a5a;
      }
    </style>
  </head>
  <body>
    <div class="grid-container">
      <div class="box">1</div>
      <div class="box">2</div>
      <div class="box tall">3 (tall content)</div>
      <div class="box">4</div>
      <div class="box">5</div>
      <div class="box">6</div>
    </div>
  </body>
</html>
